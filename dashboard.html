<div class="px-4 py-4 space-y-4 mx-auto w-full pb-24 scrollbar-hide">
  <!-- Total Net Worth Card (Adapted to match Goals Dark Card) -->
  <div class="bg-[#1e2e38] rounded-2xl p-5 text-white shadow-md relative overflow-hidden">
    <div class="relative z-10">
      <p class="text-[#3edfa4] text-[11px] font-bold tracking-widest mb-1 uppercase">Total Balance</p>
      <div class="flex items-baseline gap-1">
        <h1 class="text-4xl font-bold">₱124,500.00</h1>
      </div>
      <p class="text-[#3edfa4] text-[13px] font-bold flex items-center gap-1.5 mt-2">
        <i data-lucide="trending-up" class="w-4 h-4"></i> +₱3,240 this month
      </p>
    </div>

    <div class="flex gap-3 mt-6 relative z-10">
      <button class="flex-1 bg-[#00895c] hover:bg-[#007a52] text-white py-2.5 rounded-xl text-sm font-bold shadow-sm flex items-center justify-center gap-2 transition-colors">
        <i data-lucide="arrow-down-to-line" class="w-4 h-4"></i> Deposit
      </button>
      <button class="flex-1 bg-slate-700/50 hover:bg-slate-700 text-white py-2.5 rounded-xl text-sm font-bold shadow-sm flex items-center justify-center gap-2 transition-colors">
        <i data-lucide="arrow-up-right" class="w-4 h-4"></i> Send
      </button>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="flex gap-2 overflow-x-auto pb-1 pt-2 scrollbar-hide justify-between">
    <div class="flex flex-col items-center gap-1.5 cursor-pointer">
      <div class="w-12 h-12 bg-[#e0faee] rounded-[18px] flex items-center justify-center shadow-sm">
        <i data-lucide="credit-card" class="w-6 h-6 text-[#006e49]"></i>
      </div>
      <span class="text-[12px] font-semibold text-slate-700">Cards</span>
    </div>
    <div class="flex flex-col items-center gap-1.5 cursor-pointer">
      <div class="w-12 h-12 bg-[#d1ddf8] rounded-[18px] flex items-center justify-center shadow-sm">
        <i data-lucide="repeat" class="w-6 h-6 text-[#294c6f]"></i>
      </div>
      <span class="text-[12px] font-semibold text-slate-700">Transfer</span>
    </div>
    <div class="flex flex-col items-center gap-1.5 cursor-pointer">
      <div class="w-12 h-12 bg-[#fbdfb7] rounded-[18px] flex items-center justify-center shadow-sm">
        <i data-lucide="pie-chart" class="w-6 h-6 text-[#613601]"></i>
      </div>
      <span class="text-[12px] font-semibold text-slate-700">Invest</span>
    </div>
    <div class="flex flex-col items-center gap-1.5 cursor-pointer">
      <div class="w-12 h-12 bg-[#f0f4fb] rounded-[18px] flex items-center justify-center shadow-sm border border-slate-100">
        <i data-lucide="more-horizontal" class="w-6 h-6 text-slate-600"></i>
      </div>
      <span class="text-[12px] font-semibold text-slate-700">More</span>
    </div>
  </div>

  <!-- Recent Activity Teaser (Adapted to match Goals Cards) -->
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-[19px] text-slate-800">Recent Transactions</h3>
      <button class="text-[#006e49] font-bold text-[13px] flex items-center" onclick="loadPage('activity', 'Activity', document.querySelectorAll('.nav-item')[3])">
        See All <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>
    <div class="space-y-4">
      <div class="flex justify-between items-start">
        <div class="flex gap-3">
          <div class="w-12 h-12 bg-[#f0f4fb] rounded-[18px] flex items-center justify-center mt-1">
            <i data-lucide="coffee" class="w-6 h-6 text-[#294c6f]"></i>
          </div>
          <div>
            <h4 class="font-bold text-[16px] text-slate-800">Starbucks</h4>
            <p class="text-slate-500 text-[13px] mt-0.5">Today, 8:42 AM</p>
          </div>
        </div>
        <span class="font-bold text-[16px] text-slate-800 mt-1">-₱4.50</span>
      </div>

      <div class="ml-[60px] h-[1px] w-[calc(100%-60px)] bg-slate-100"></div>

      <div class="flex justify-between items-start">
        <div class="flex gap-3">
          <div class="w-12 h-12 bg-[#e0faee] rounded-[18px] flex items-center justify-center mt-1">
            <i data-lucide="arrow-down-left" class="w-6 h-6 text-[#006e49]"></i>
          </div>
          <div>
            <h4 class="font-bold text-[16px] text-slate-800">Salary Deposit</h4>
            <p class="text-slate-500 text-[13px] mt-0.5">Yesterday</p>
          </div>
        </div>
        <span class="font-bold text-[16px] text-[#00895c] mt-1">+₱3,200.00</span>
      </div>

      <div class="ml-[60px] h-[1px] w-[calc(100%-60px)] bg-slate-100"></div>

      <div class="flex justify-between items-start">
        <div class="flex gap-3">
          <div class="w-12 h-12 bg-[#fbe7e6] rounded-[18px] flex items-center justify-center mt-1">
            <i data-lucide="shopping-bag" class="w-6 h-6 text-[#c93b32]"></i>
          </div>
          <div>
            <h4 class="font-bold text-[16px] text-slate-800">Whole Foods</h4>
            <p class="text-slate-500 text-[13px] mt-0.5">Yesterday</p>
          </div>
        </div>
        <span class="font-bold text-[16px] text-slate-800 mt-1">-₱84.20</span>
      </div>
    </div>
  </div>
</div>
