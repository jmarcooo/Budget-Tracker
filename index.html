<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Goals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#fafafc] sm:bg-slate-100 sm:flex sm:justify-center sm:min-h-screen sm:py-8 m-0 p-0">
  <div class="w-full sm:max-w-[400px] h-[100dvh] sm:max-h-[850px] sm:my-auto bg-[#fafafc] sm:rounded-[40px] sm:shadow-2xl sm:border-[8px] sm:border-slate-800 relative overflow-hidden font-sans text-slate-800 flex flex-col mx-auto">

      <header class="flex items-center justify-between px-4 py-4 bg-white sticky top-0 z-40 shadow-sm shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-[#00895c] rounded-lg flex items-center justify-center text-white font-bold">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" class="w-5 h-5">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              <path d="M9 12l2 2 4-4" />
            </svg>
          </div>
          <span class="font-bold text-[15px] text-[#006e49]">Vault</span>
        </div>
        <div id="header-title" class="font-semibold text-[17px] text-slate-800 absolute left-1/2 -translate-x-1/2">Dashboard</div>
        <div class="flex -space-x-3">
          <img src="https://i.pravatar.cc/100?img=47" alt="Patricia" class="w-9 h-9 rounded-full border-2 border-white relative z-10" />
          <img src="https://i.pravatar.cc/100?img=11" alt="Jon" class="w-9 h-9 rounded-full border-2 border-white relative z-0" />
        </div>
      </header>


      <main id="app-content" class="flex-1 overflow-y-auto pb-24 scrollbar-hide relative">
        <!-- Content will be loaded here -->
      </main>


      <nav class="absolute bottom-0 w-full bg-[#f8f9fa] border-t border-slate-200 px-6 py-2 flex justify-between items-center z-50 pb-safe">
        <div class="nav-item flex flex-col items-center gap-1 text-[#006e49] mt-1 cursor-pointer active-nav" onclick="loadPage('dashboard', 'Dashboard', this)">
          <i data-lucide="home" class="w-[26px] h-[26px] fill-[#006e49] text-white stroke-[1.5] nav-icon"></i>
          <span class="text-[11px] font-bold">Dashboard</span>
        </div>
        <div class="nav-item flex flex-col items-center gap-1 text-slate-500 relative mt-1 cursor-pointer" onclick="loadPage('goals', 'Goals', this)">
          <i data-lucide="target" class="w-[26px] h-[26px] nav-icon"></i>
          <span class="text-[11px] font-semibold">Goals</span>
        </div>


        <div class="relative -top-5 flex flex-col items-center cursor-pointer" onclick="toggleTrackModal()">
          <div class="w-14 h-14 bg-[#006e49] rounded-full flex items-center justify-center shadow-lg shadow-[#006e49]/30 text-white border-[3px] border-white hover:bg-[#005a4a] transition-colors">
            <i data-lucide="plus" class="w-7 h-7" strokeWidth="2.5"></i>
          </div>
          <span class="text-[11px] font-semibold text-slate-600 mt-0.5">Track</span>
        </div>

        <div class="nav-item flex flex-col items-center gap-1 text-slate-500 mt-1 cursor-pointer" onclick="loadPage('activity', 'Activity', this)">
          <i data-lucide="file-text" class="w-[26px] h-[26px] nav-icon"></i>
          <span class="text-[11px] font-semibold">Activity</span>
        </div>
        <div class="nav-item flex flex-col items-center gap-1 text-slate-500 mt-1 cursor-pointer" onclick="loadPage('analytics', 'Analytics', this)">
          <i data-lucide="bar-chart2" class="w-[26px] h-[26px] nav-icon"></i>
          <span class="text-[11px] font-semibold">Analytics</span>
        </div>
      </nav>

      <!-- Savings Drawer Backdrop -->
      <div id="savings-drawer-backdrop" class="absolute inset-0 bg-slate-900/40 z-[60] backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300" onclick="toggleSavingsDrawer()"></div>

      <!-- Savings Drawer Content -->
      <div id="savings-drawer" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] z-[70] transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[85%]">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-2 shrink-0"></div>
        <div class="px-6 py-4 pb-8 space-y-6 overflow-y-auto">
          <div class="flex justify-between items-center sticky top-0 bg-white py-2 z-10">
            <h2 class="text-[15px] font-bold text-slate-800">Joint Savings</h2>
            <button class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500" onclick="toggleSavingsDrawer()">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="space-y-4">
            <!-- Account 1 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
              <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-[#e0faee] rounded-[14px] flex items-center justify-center">
                    <i data-lucide="landmark" class="w-5 h-5 text-[#006e49]"></i>
                  </div>
                  <div>
                    <h4 class="font-bold text-[15px] text-slate-800">BDO Joint Account</h4>
                    <p class="text-[12px] text-slate-500">Primary Savings</p>
                  </div>
                </div>
                <div class="text-right">
                  <p class="font-bold text-[16px] text-slate-800">₱45,200.00</p>
                </div>
              </div>
            </div>

            <!-- Account 2 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
              <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-[#d1ddf8] rounded-[14px] flex items-center justify-center">
                    <img src="https://i.pravatar.cc/100?img=11" alt="Jon" class="w-10 h-10 rounded-[14px] object-cover" />
                  </div>
                  <div>
                    <h4 class="font-bold text-[15px] text-slate-800">Gcash (Jon)</h4>
                    <p class="text-[12px] text-slate-500">Personal Wallet</p>
                  </div>
                </div>
                <div class="text-right">
                  <p class="font-bold text-[16px] text-slate-800">₱12,450.00</p>
                </div>
              </div>
            </div>

            <!-- Account 3 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
              <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-[#fbe7e6] rounded-[14px] flex items-center justify-center">
                    <img src="https://i.pravatar.cc/100?img=47" alt="Patricia" class="w-10 h-10 rounded-[14px] object-cover" />
                  </div>
                  <div>
                    <h4 class="font-bold text-[15px] text-slate-800">BPI (Patricia)</h4>
                    <p class="text-[12px] text-slate-500">Personal Savings</p>
                  </div>
                </div>
                <div class="text-right">
                  <p class="font-bold text-[16px] text-slate-800">₱66,850.00</p>
                </div>
              </div>
            </div>
          </div>

          <button class="w-full bg-[#006e49] text-white font-bold py-4 rounded-xl shadow-md flex items-center justify-center gap-2" onclick="toggleAddAccountModal(); toggleSavingsDrawer();">
            <i data-lucide="plus" class="w-5 h-5"></i> Add Account
          </button>
        </div>
      </div>

      <!-- Add Account Modal Backdrop -->
      <div id="add-account-modal-backdrop" class="absolute inset-0 bg-slate-900/40 z-[80] backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300" onclick="toggleAddAccountModal()"></div>

      <!-- Add Account Modal Content -->
      <div id="add-account-modal" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] z-[90] transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[85%]">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-2 shrink-0"></div>
        <div class="px-6 py-4 pb-8 space-y-6 overflow-y-auto">
          <div class="flex justify-between items-center sticky top-0 bg-white py-2 z-10">
            <h2 class="text-[15px] font-bold text-slate-800">Add Account</h2>
            <button class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500" onclick="toggleAddAccountModal()">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="space-y-4 mt-2">
            <!-- Account Name -->
            <div class="space-y-2">
              <label class="text-[11px] font-semibold text-slate-600">Account Name</label>
              <input type="text" placeholder="e.g. BPI Savings" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 font-medium text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49] placeholder:text-slate-400" />
            </div>

            <div class="grid grid-cols-2 gap-4">
              <!-- Account Type -->
              <div class="space-y-2">
                <label class="text-[11px] font-semibold text-slate-600">Account Type</label>
                <div class="relative">
                  <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 appearance-none font-semibold text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49] truncate pr-10">
                    <option value="savings">Savings</option>
                    <option value="wallet">E-Wallet</option>
                    <option value="cash">Cash</option>
                    <option value="credit">Credit Card</option>
                  </select>
                  <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
              </div>

              <!-- Owner -->
              <div class="space-y-2">
                <label class="text-[11px] font-semibold text-slate-600">Owner</label>
                <div class="relative">
                  <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 appearance-none font-semibold text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49] truncate pr-10">
                    <option value="joint">Joint</option>
                    <option value="jon">Jon</option>
                    <option value="patricia">Patricia</option>
                  </select>
                  <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
              </div>
            </div>

            <!-- Initial Balance -->
            <div class="space-y-2">
              <label class="text-[11px] font-semibold text-slate-600">Initial Balance</label>
              <div class="flex items-center w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus-within:border-[#006e49] focus-within:ring-1 focus-within:ring-[#006e49]">
                <span class="text-slate-400 font-bold mr-2">₱</span>
                <input type="number" placeholder="0.00" class="w-full bg-transparent font-medium text-slate-700 outline-none placeholder:text-slate-400" />
              </div>
            </div>
          </div>

          <button class="w-full bg-[#006e49] text-white font-bold py-4 rounded-xl shadow-md" onclick="toggleAddAccountModal()">
            Create Account
          </button>
        </div>
      </div>

      <!-- Track Modal Backdrop -->
      <div id="track-modal-backdrop" class="absolute inset-0 bg-slate-900/40 z-[60] backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300" onclick="toggleTrackModal()"></div>

      <!-- Track Modal Content -->
      <div id="track-modal" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] z-[70] transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[85%]">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-2 shrink-0"></div>
        <div class="px-6 py-4 pb-8 space-y-6 overflow-y-auto">
          <div class="flex justify-between items-center sticky top-0 bg-white py-2 z-10">
            <h2 class="text-[15px] font-bold text-slate-800">Track Transaction</h2>
            <button class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500" onclick="toggleTrackModal()">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- Type Toggle -->
          <div class="flex bg-slate-100 rounded-xl p-1 relative mt-2">
            <div id="type-indicator" class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-white rounded-lg shadow-sm transition-transform duration-300"></div>
            <button class="flex-1 py-2.5 text-[11px] font-bold text-slate-800 relative z-10" onclick="setTrackType('expense')">Expense</button>
            <button class="flex-1 py-2.5 text-[11px] font-bold text-slate-500 relative z-10" onclick="setTrackType('income')">Income</button>
          </div>

          <!-- Amount -->
          <div class="flex flex-col items-center py-4">
            <span class="text-slate-500 font-semibold mb-1">Amount</span>
            <div class="flex items-center text-3xl font-bold text-slate-800">
              <span class="text-[15px] mr-1 text-slate-400">₱</span>
              <input type="number" placeholder="0.00" class="w-full max-w-[200px] text-center bg-transparent outline-none placeholder:text-slate-300" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <!-- Account -->
            <div class="space-y-2">
              <label class="text-[11px] font-semibold text-slate-600">Account</label>
              <div class="relative">
                <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 appearance-none font-semibold text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49] truncate pr-10">
                  <option value="joint">Joint Account</option>
                  <option value="jon">Jon's Wallet</option>
                  <option value="patricia">Patricia's Wallet</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>
            </div>

            <!-- Member (Who paid/earned) -->
            <div class="space-y-2">
              <label class="text-[11px] font-semibold text-slate-600">Member</label>
              <div class="relative">
                <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 appearance-none font-semibold text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49] truncate pr-10">
                  <option value="both">Both (Shared)</option>
                  <option value="jon">Jon</option>
                  <option value="patricia">Patricia</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <!-- Responsibility Toggle -->
            <div class="space-y-2">
              <label class="text-[11px] font-semibold text-slate-600">Responsibility</label>
              <div class="relative">
                <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 appearance-none font-semibold text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49] truncate pr-10">
                  <option value="shared">Shared Expense</option>
                  <option value="personal">Personal Expense</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>
            </div>

            <!-- Recurring Toggle -->
            <div class="space-y-2">
              <label class="text-[11px] font-semibold text-slate-600">Frequency</label>
              <div class="relative">
                <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 appearance-none font-semibold text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49] truncate pr-10">
                  <option value="oneoff">One-off</option>
                  <option value="monthly">Monthly</option>
                  <option value="weekly">Weekly</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>
            </div>
          </div>

          <!-- Category -->
          <div class="space-y-2">
            <label class="text-[11px] font-semibold text-slate-600">Category</label>
            <div class="relative">
              <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 appearance-none font-semibold text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49]">
                <optgroup label="Income">
                  <option value="salary_primary">Primary Salary</option>
                  <option value="salary_side">Side-Project Revenue</option>
                  <option value="other_income">Other Income</option>
                </optgroup>
                <optgroup label="Expense">
                  <option value="food">Food & Dining</option>
                  <option value="transport">Transportation</option>
                  <option value="shopping">Shopping</option>
                  <option value="bills">Bills & Utilities</option>
                  <option value="entertainment">Entertainment</option>
                  <option value="rent">Rent/Mortgage</option>
                  <option value="hobbies">Hobbies</option>
                </optgroup>
              </select>
              <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>
          </div>

          <!-- Note -->
          <div class="space-y-2">
            <label class="text-[11px] font-semibold text-slate-600">Note (Optional)</label>
            <input type="text" placeholder="What was this for?" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 font-medium text-slate-700 outline-none focus:border-[#006e49] focus:ring-1 focus:ring-[#006e49] placeholder:text-slate-400" />
          </div>

          <button class="w-full bg-[#006e49] text-white font-bold py-4 rounded-xl shadow-md" onclick="toggleTrackModal()">
            Save Transaction
          </button>
        </div>
      </div>

    </div>


    <script>
        // Modal logic
        function toggleSavingsDrawer() {
            const drawer = document.getElementById('savings-drawer');
            const backdrop = document.getElementById('savings-drawer-backdrop');

            if (drawer.classList.contains('translate-y-full')) {
                drawer.classList.remove('translate-y-full');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                drawer.classList.add('translate-y-full');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function toggleAddAccountModal() {
            const modal = document.getElementById('add-account-modal');
            const backdrop = document.getElementById('add-account-modal-backdrop');

            if (modal.classList.contains('translate-y-full')) {
                // Open
                modal.classList.remove('translate-y-full');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                // Close
                modal.classList.add('translate-y-full');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function toggleTrackModal() {
            const modal = document.getElementById('track-modal');
            const backdrop = document.getElementById('track-modal-backdrop');

            if (modal.classList.contains('translate-y-full')) {
                // Open
                modal.classList.remove('translate-y-full');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                // Close
                modal.classList.add('translate-y-full');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function setTrackType(type) {
            const indicator = document.getElementById('type-indicator');
            const buttons = indicator.parentElement.querySelectorAll('button');

            if (type === 'expense') {
                indicator.style.transform = 'translateX(0)';
                buttons[0].classList.replace('text-slate-500', 'text-slate-800');
                buttons[1].classList.replace('text-slate-800', 'text-slate-500');
            } else {
                indicator.style.transform = 'translateX(100%)';
                buttons[1].classList.replace('text-slate-500', 'text-slate-800');
                buttons[0].classList.replace('text-slate-800', 'text-slate-500');
            }
        }

        // Initialize lucide icons for the static parts
        lucide.createIcons();

        // Page loader function
        async function loadPage(pageName, title, element) {
            try {
                const response = await fetch(`./${pageName}.html`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const html = await response.text();

                document.getElementById('app-content').innerHTML = html;
                document.getElementById('header-title').textContent = title;

                // Update nav styles
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('text-[#006e49]');
                    item.classList.add('text-slate-500');
                    item.classList.remove('active-nav');

                    // Reset icons
                    const icon = item.querySelector('.nav-icon');
                    if (icon) {
                        icon.classList.remove('fill-[#006e49]', 'text-white', 'stroke-[1.5]');
                    }

                    const text = item.querySelector('span');
                    if (text) {
                        text.classList.remove('font-bold');
                        text.classList.add('font-semibold');
                    }
                });

                if (element) {
                    element.classList.remove('text-slate-500');
                    element.classList.add('text-[#006e49]', 'active-nav');

                    const icon = element.querySelector('.nav-icon');
                    if (icon) {
                        icon.classList.add('fill-[#006e49]', 'text-white', 'stroke-[1.5]');
                    }

                    const text = element.querySelector('span');
                    if (text) {
                        text.classList.remove('font-semibold');
                        text.classList.add('font-bold');
                    }
                }

                // Re-initialize icons for loaded content
                lucide.createIcons();
            } catch (error) {
                console.error('Error loading page:', error);
                document.getElementById('app-content').innerHTML = `
                    <div class="flex items-center justify-center h-full p-4 text-center text-slate-500">
                        <p>Error loading ${title}. Please try again.</p>
                    </div>
                `;
            }
        }

        // Load default page
        window.addEventListener('DOMContentLoaded', () => {
            const defaultNav = document.querySelector('.active-nav');
            loadPage('dashboard', 'Dashboard', defaultNav);
        });
    </script>
</body>
</html>
